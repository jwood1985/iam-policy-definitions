        <div class="tick">MSFT <span class="up">+0.9% $412.30</span></div>
        <div class="tick">TSLA <span class="down">-1.2% $248.90</span></div>
        <div class="tick">AMZN <span class="up">+3.1% $198.70</span></div>
        <div class="tick">NVDA <span class="up">+5.6% $875.40</span></div>
        <div class="tick">META <span class="up">+2.0% $534.20</span></div>
        <div class="tick">BTC <span class="up">+4.3% $67,450</span></div>
      </div>
      <div class="hero">
        <h1>AI-Powered Trading Intelligence</h1>
        <p>Make smarter investment decisions with real-time AI analysis</p>
        <a href="/markets" class="btn">View Markets</a>
        <a href="/analysis" class="btn btn-secondary" style="margin-left:10px">AI Analysis</a>
      </div>
      <div class="cards">
        <div class="card">
          <h3>AI Signals</h3>
          <p style="color:#8b949e">Real-time buy/sell signals powered by ML models trained on 20 years of market data.</p>
          <a href="/analysis" style="color:#58a6ff">View signals</a>
        </div>
        <div class="card">
          <h3>Market Analytics</h3>
          <p style="color:#8b949e">Deep dive into sector performance, correlation analysis, and volatility forecasting.</p>
          <a href="/markets" style="color:#58a6ff">Explore markets</a>
