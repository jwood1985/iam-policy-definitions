        .btn-secondary { background: #21262d; border: 1px solid #30363d; color: #c9d1d9; }
        .cards { display: flex; gap: 20px; padding: 40px; flex-wrap: wrap; justify-content: center; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 25px; width: 280px; }
        .card h3 { color: #58a6ff; margin: 0 0 10px; }
        footer { background: #161b22; color: #8b949e; text-align: center; padding: 20px; border-top: 1px solid #30363d; margin-top: 40px; }
      </style>
    </head>
