apiVersion: v1
kind: ConfigMap
metadata:
  name: trade-advisor-app
  namespace: frontend-apps
data:
  server.js: |
    const http = require('http');
    const url = require('url');
    const fs = require('fs');
    const path = require('path');

    const APP_DIR = '/app';

    function loadPage(name) {
      try { return fs.readFileSync(path.join(APP_DIR, name), 'utf8'); }
      catch (e) { return '<html><body><h1>Page not found</h1></body></html>'; }
    }

    function getAnalysisPage(type) {
      const nav = '<header style="background:#161b22;padding:20px 40px;border-bottom:1px solid #30363d">'
        + '<span style="font-size:1.5em;font-weight:bold;color:#58a6ff">TradeAdvisor AI</span>'
        + '<nav style="display:inline;margin-left:30px">'
        + '<a href="/" style="color:#58a6ff;margin:0 10px;text-decoration:none">Home</a>'
        + '<a href="/markets" style="color:#58a6ff;margin:0 10px;text-decoration:none">Markets</a>'
        + '<a href="/portfolio" style="color:#58a6ff;margin:0 10px;text-decoration:none">Portfolio</a>'
        + '<a href="/analysis" style="color:#58a6ff;margin:0 10px;text-decoration:none">Analysis</a>'
        + '</nav></header>';
      return '<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>AI Analysis - TradeAdvisor</title>'
        + '<style>body{font-family:Arial,sans-serif;margin:0;background:#0d1117;color:#e6edf3}'
        + '.content{padding:30px 40px}.signal-card{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:20px;margin-bottom:15px}'
        + 'footer{background:#161b22;color:#8b949e;text-align:center;padding:20px;border-top:1px solid #30363d;margin-top:40px}'
        + '</style></head><body>'
        + nav
        + '<div class="content"><h1 style="color:#58a6ff">AI Market Analysis</h1>'
        + '<p style="color:#8b949e">Type: ' + (type || 'general') + ' | Updated: ' + new Date().toLocaleString() + '</p>'
        + '<div class="signal-card"><h3 style="color:#3fb950">STRONG BUY - NVDA</h3>'
        + '<p>AI confidence: 94% | Target: $950 | Timeframe: 30 days</p>'
        + '<p style="color:#8b949e">NVIDIA continues to dominate the AI chip market.</p></div>'
        + '<div class="signal-card"><h3 style="color:#3fb950">BUY - AAPL</h3>'
        + '<p>AI confidence: 78% | Target: $210 | Timeframe: 60 days</p>'
        + '<p style="color:#8b949e">Apple Intelligence features driving upgrade cycle.</p></div>'
        + '<div class="signal-card"><h3 style="color:#f85149">SELL - TSLA</h3>'
        + '<p>AI confidence: 71% | Target: $210 | Timeframe: 45 days</p>'
        + '<p style="color:#8b949e">Margin pressure from price cuts continues.</p></div>'
        + '</div><footer>&copy; 2026 TradeAdvisor AI - Not financial advice.</footer></body></html>';
    }

    function getStockPage(symbol) {
      const nav = '<header style="background:#161b22;padding:20px 40px;border-bottom:1px solid #30363d">'
        + '<span style="font-size:1.5em;font-weight:bold;color:#58a6ff">TradeAdvisor AI</span>'
        + '<nav style="display:inline;margin-left:30px">'
        + '<a href="/" style="color:#58a6ff;margin:0 10px;text-decoration:none">Home</a>'
        + '<a href="/markets" style="color:#58a6ff;margin:0 10px;text-decoration:none">Markets</a>'
        + '</nav></header>';
      return '<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>' + symbol + ' - TradeAdvisor AI</title>'
        + '<style>body{font-family:Arial,sans-serif;margin:0;background:#0d1117;color:#e6edf3}'
        + 'footer{background:#161b22;color:#8b949e;text-align:center;padding:20px;border-top:1px solid #30363d;margin-top:40px}'
        + '</style></head><body>'
        + nav
        + '<div style="padding:30px 40px"><h1 style="color:#58a6ff">' + symbol + ' Stock Detail</h1>'
        + '<p>AI-powered analysis for ' + symbol + '.</p>'
        + '<a href="/markets" style="color:#58a6ff">Back to Markets</a>'
        + '</div><footer>&copy; 2026 TradeAdvisor AI</footer></body></html>';
    }

    const server = http.createServer(function(req, res) {
      const parsed = url.parse(req.url, true);
      const pathname = parsed.pathname;
      const query = parsed.query;
      res.setHeader('X-Powered-By', 'TradeAdvisor-AI/1.0');
      if (pathname === '/' || pathname === '/index.html') {
        res.writeHead(200, {'Content-Type': 'text/html; charset=utf-8'});
        res.end(loadPage('index.html'));
      } else if (pathname === '/markets') {
        res.writeHead(200, {'Content-Type': 'text/html; charset=utf-8'});
        res.end(loadPage('markets.html'));
      } else if (pathname === '/portfolio') {
        res.writeHead(200, {'Content-Type': 'text/html; charset=utf-8'});
        res.end(loadPage('portfolio.html'));
      } else if (pathname === '/about') {
        res.writeHead(200, {'Content-Type': 'text/html; charset=utf-8'});
        res.end(loadPage('about.html'));
      } else if (pathname === '/analysis') {
        res.writeHead(200, {'Content-Type': 'text/html; charset=utf-8'});
        res.end(getAnalysisPage(query.type));
      } else if (pathname.startsWith('/stock/')) {
        const sym = pathname.replace('/stock/', '').toUpperCase();
        res.writeHead(200, {'Content-Type': 'text/html; charset=utf-8'});
        res.end(getStockPage(sym));
      } else if (pathname === '/health') {
        res.writeHead(200, {'Content-Type': 'application/json'});
        res.end(JSON.stringify({status:'ok',app:'trade-advisor'}));
      } else {
        res.writeHead(302, {'Location': '/'});
        res.end();
      }
    });

    server.listen(3000, '0.0.0.0', function() {
      console.log('[trade-advisor] Server running on port 3000');
    });

  index.html: |
    <!DOCTYPE html>
