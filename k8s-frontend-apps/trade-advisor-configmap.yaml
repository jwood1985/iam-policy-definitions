        header { background: #161b22; padding: 20px 40px; border-bottom: 1px solid #30363d; }
        nav a { color: #58a6ff; margin: 0 15px; text-decoration: none; font-weight: bold; }
        .ticker { background: #161b22; padding: 10px 40px; display: flex; gap: 30px; overflow-x: auto; border-bottom: 1px solid #30363d; }
        .tick { display: flex; gap: 8px; align-items: center; white-space: nowrap; }
        .up { color: #3fb950; } .down { color: #f85149; }
        .hero { background: linear-gradient(135deg, #0d1117, #1c2128); padding: 80px 40px; text-align: center; border-bottom: 1px solid #30363d; }
